services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
      NEXT_STATIC_HOST: ${NEXT_STATIC_HOST}
      NEXT_REVALIDATE_SECONDS: ${NEXT_REVALIDATE_SECONDS}
      WORKER_ENV: ${WORKER_ENV}
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      WORKER_ENV: ${WORKER_ENV}
      DEFAULT_PODCAST_VARIANT: ${DEFAULT_PODCAST_VARIANT}
      QUEUE_PREFIX: ${QUEUE_PREFIX}
      QUEUE_JOB_ATTEMPTS: ${QUEUE_JOB_ATTEMPTS}
      QUEUE_JOB_BACKOFF_MS: ${QUEUE_JOB_BACKOFF_MS}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["node", "apps/worker/dist/index.js", "worker"]
    healthcheck:
      test: ["CMD", "node", "-e", "process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 5

  scheduler:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      REDIS_URL: ${REDIS_URL}
      DATABASE_URL: ${DATABASE_URL}
      WORKER_ENV: ${WORKER_ENV}
      DEFAULT_PODCAST_VARIANT: ${DEFAULT_PODCAST_VARIANT}
      QUEUE_PREFIX: ${QUEUE_PREFIX}
      QUEUE_JOB_ATTEMPTS: ${QUEUE_JOB_ATTEMPTS}
      QUEUE_JOB_BACKOFF_MS: ${QUEUE_JOB_BACKOFF_MS}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY}
    depends_on:
      worker:
        condition: service_started
    command: ["sh", "-c", "while true; do node apps/worker/dist/index.js run-daily $$(date -u +%F) ${DEFAULT_PODCAST_VARIANT}; sleep 86400; done"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./packages/storage/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 10s
      retries: 5

  proxy:
    image: caddy:2.9.1-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${PROXY_HTTP_PORT}:80"
      - "${PROXY_HTTPS_PORT}:443"
    volumes:
      - ./infra/compose/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  redis-data:
  postgres-data:
  minio-data:
  caddy-data:
  caddy-config:
